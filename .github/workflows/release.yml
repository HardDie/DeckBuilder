name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: DeckBuilder
  NODE_OPTIONS: "--max-old-space-size=4096"
  # proxy.golang.org sometimes RST large zips over HTTP/2 (genproto on arm runners).
  GODEBUG: http2client=0
  GOPROXY: https://proxy.golang.org,direct

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            wails_platform: linux/amd64
            artifact: linux-amd64.tar.gz
          - name: linux-arm64
            os: ubuntu-24.04-arm
            wails_platform: linux/arm64
            artifact: linux-arm64.tar.gz
          - name: windows-amd64
            os: windows-latest
            wails_platform: windows/amd64
            artifact: windows-amd64.zip
          - name: darwin-universal
            os: macos-latest
            wails_platform: darwin/universal
            artifact: darwin-universal.zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Wails project
        shell: bash
        run: |
          if [ ! -f wails.json ]; then
            echo "wails.json missing; scaffold the app before tagging a release."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Yarn
        shell: bash
        run: npm install -g yarn@1.22.22

      - name: Linux Wails dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev xvfb gcc pkg-config make libjpeg-turbo8-dev
          archive="$(./scripts/find-libjpeg-a.sh)"
          if [ -n "$archive" ] && [ -f "$archive" ]; then
            echo "libjpeg.a: $archive"
            exit 0
          fi
          echo "distro package has no libjpeg.a; building libjpeg-turbo"
          sudo apt-get install -y cmake nasm curl ca-certificates
          ver=3.1.4.1
          src="${RUNNER_TEMP}/libjpeg-turbo-src"
          prefix="${RUNNER_TEMP}/libjpeg-turbo"
          curl -fsSL -o "${RUNNER_TEMP}/libjpeg-turbo.tar.gz" \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${ver}/libjpeg-turbo-${ver}.tar.gz"
          mkdir -p "$src"
          tar -xzf "${RUNNER_TEMP}/libjpeg-turbo.tar.gz" -C "$src" --strip-components=1
          cmake -S "$src" -B "$src/build" \
            -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DWITH_JPEG8=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build "$src/build" --target install --parallel
          if [ -f "$prefix/lib64/libjpeg.a" ]; then
            lib="$prefix/lib64/libjpeg.a"
          else
            lib="$prefix/lib/libjpeg.a"
          fi
          test -f "$lib"
          echo "JPEG_LIBJPEG_A=$lib" >> "$GITHUB_ENV"
          echo "JPEG_INCLUDE=$prefix/include" >> "$GITHUB_ENV"
          echo "libjpeg.a: $lib"

      - name: macOS libjpeg-turbo
        if: runner.os == 'macOS'
        run: |
          brew install jpeg-turbo
          prefix="$(brew --prefix jpeg-turbo)"
          archive="$prefix/lib/libjpeg.a"
          test -f "$archive"
          echo "libjpeg.a: $archive"
          if [ "${{ matrix.wails_platform }}" != "darwin/universal" ]; then
            exit 0
          fi
          if lipo -info "$archive" | grep -q x86_64; then
            exit 0
          fi
          echo "brew libjpeg.a is $(lipo -info "$archive"); building an x86_64 slice"
          brew install cmake nasm
          ver="$(awk '/LIBJPEG_TURBO_VERSION  /{print $3; exit}' "$prefix/include/jconfig.h")"
          src="${RUNNER_TEMP}/libjpeg-turbo-src"
          x64="${RUNNER_TEMP}/libjpeg-turbo-x86_64"
          curl -fsSL -o "${RUNNER_TEMP}/libjpeg-turbo.tar.gz" \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${ver}/libjpeg-turbo-${ver}.tar.gz"
          mkdir -p "$src"
          tar -xzf "${RUNNER_TEMP}/libjpeg-turbo.tar.gz" -C "$src" --strip-components=1
          cmake -S "$src" -B "$src/build-x64" \
            -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DWITH_JPEG8=ON \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$x64"
          cmake --build "$src/build-x64" --target install --parallel
          # The Homebrew archive is read-only. The Makefile links JPEG_LIBJPEG_A instead.
          fat="${RUNNER_TEMP}/libjpeg-universal.a"
          lipo -create "$archive" "$x64/lib/libjpeg.a" -output "$fat"
          lipo -info "$fat"
          echo "JPEG_LIBJPEG_A=$fat" >> "$GITHUB_ENV"
          echo "JPEG_INCLUDE=$prefix/include" >> "$GITHUB_ENV"

      - name: Windows libjpeg-turbo
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          release: false
          path-type: inherit
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libjpeg-turbo

      - name: Download Go modules
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt ${i}); retrying..."
            sleep $((i * 8))
          done
          exit 1

      - name: Install Wails CLI
        shell: bash
        run: |
          WAILS_VER="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VER}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        run: |
          # -skipbindings: committed frontend/wailsjs. Generate locally after binding changes.
          # make build sets the static libjpeg.a link. Ubuntu tags come from the Makefile.
          args=(-skipbindings -platform "${{ matrix.wails_platform }}")
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a make build "WAILS_BUILD_ARGS=${args[*]}"
          else
            make build "WAILS_BUILD_ARGS=${args[*]}"
          fi

      # Direct dependencies only. ldd also lists libraries that WebKitGTK loads,
      # and WebKitGTK itself depends on libjpeg.so.
      - name: Static libjpeg check
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)
              deps="$(readelf -d "build/bin/${APP_NAME}" | grep NEEDED)" ;;
            macOS)
              deps="$(otool -L "build/bin/${APP_NAME}.app/Contents/MacOS/${APP_NAME}")" ;;
            Windows)
              deps="$(objdump -p "build/bin/${APP_NAME}.exe" | grep 'DLL Name')" ;;
          esac
          echo "$deps"
          if echo "$deps" | grep -i jpeg; then
            echo "libjpeg is a shared dependency"
            exit 1
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          ARTIFACT="${APP_NAME}-${{ github.ref_name }}-${{ matrix.artifact }}"
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp build/linux/install.sh "build/linux/${APP_NAME}.desktop" build/bin/
            cp build/appicon.png "build/bin/${APP_NAME}.png"
            chmod +x build/bin/install.sh
          fi
          cd build/bin
          if [ "${{ runner.os }}" = "macOS" ]; then
            zip -r "../../dist/${ARTIFACT}" .
          else
            tar -czf "../../dist/${ARTIFACT}" .
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/bin/* -DestinationPath "dist/$env:APP_NAME-${{ github.ref_name }}-${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ env.APP_NAME }}-${{ github.ref_name }}-${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
