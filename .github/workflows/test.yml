name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Go module
        id: mod
        run: |
          if [ -f go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.mod.outputs.present == 'true'
        with:
          go-version: "1.27.1"
          cache: true

      - name: Unit tests
        if: steps.mod.outputs.present == 'true'
        run: |
          go test -race -count=1 -tags=nomain .
          go test -race -count=1 -tags=nomain ./bindings/...
          go test -race -count=1 -tags=nomain ./internal/...
          go test -race -count=1 -tags=nomain ./pkg/...

      - name: Integration tests
        if: steps.mod.outputs.present == 'true'
        run: go test -tags=integration -count=1 ./internal/...

      - name: Skip (project not scaffolded)
        if: steps.mod.outputs.present != 'true'
        run: echo "No go.mod yet; skipping tests until Wails scaffold and packages exist."
