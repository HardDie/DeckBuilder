name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Go module
        id: mod
        run: |
          if [ -f go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.mod.outputs.present == 'true'
        with:
          go-version: "1.27.1"
          cache: true

      - name: Install C build tools
        if: steps.mod.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config make cmake nasm curl

      - name: Cache C libraries
        if: steps.mod.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: build/third_party
          key: third-party-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third_party/**') }}

      - name: Unit tests
        if: steps.mod.outputs.present == 'true'
        run: make test

      - name: Integration tests
        if: steps.mod.outputs.present == 'true'
        run: make test-integration

      - name: Skip (project not scaffolded)
        if: steps.mod.outputs.present != 'true'
        run: echo "No go.mod yet; skipping tests until Wails scaffold and packages exist."
